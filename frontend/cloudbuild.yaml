steps:
  # 1. Install JS dependencies
  - name: 'node:22'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['ci']

  # 2. Write frontend/.env & root .env for production release bundle & Maps SDK
  - name: 'node:22'
    dir: 'frontend'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cat <<EOF > .env
        USE_MOCKS=false
        LIVE_APIS=capture,tango,review,user,places,prepare,rehearse
        API_BASE_URL=${_API_BASE_URL}
        FIREBASE_API_KEY=${_FIREBASE_API_KEY}
        FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
        FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
        FIREBASE_APP_ID=${_FIREBASE_WEB_APP_ID}
        EOF
        echo "Generated frontend/.env successfully (USE_MOCKS=false)"

        cat <<EOF > ../.env
        GOOGLE_MAPS_API_KEY=${_GOOGLE_MAPS_API_KEY}
        EOF
        echo "Generated root .env for Android Google Maps"

  # 3. Run Lint & Jest Unit Tests
  - name: 'node:22'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['test', '--', '--watchAll=false', '--no-watchman', '--forceExit']

  # 4. Compile Signed Android Release APK
  - name: 'reactnativecommunity/react-native-android:latest'
    dir: 'frontend/android'
    entrypoint: './gradlew'
    args: ['assembleRelease', '--no-daemon', '--stacktrace']
    env:
      - 'GOOGLE_MAPS_API_KEY=${_GOOGLE_MAPS_API_KEY}'

  # 5. Distribute Android APK exclusively via Firebase App Distribution
  - name: 'node:22'
    dir: 'frontend'
    entrypoint: 'npx'
    args:
      - '--yes'
      - 'firebase-tools@latest'
      - 'appdistribution:distribute'
      - 'android/app/build/outputs/apk/release/app-release.apk'
      - '--app'
      - '${_FIREBASE_ANDROID_APP_ID}'
      - '--groups'
      - '${_TESTER_GROUPS}'
      - '--release-notes'
      - 'Automated Android build from commit $SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  
substitutions:
  _FIREBASE_ANDROID_APP_ID: '1:166488207235:android:30da40c2a9509a1d2990b6'
  _TESTER_GROUPS: 'hackathon-testers'
  _API_BASE_URL: 'https://fastapi-backend-166488207235.asia-east1.run.app'
  _FIREBASE_PROJECT_ID: 'project-79470ae0-a7db-4972-b22'
  _FIREBASE_AUTH_DOMAIN: 'project-79470ae0-a7db-4972-b22.firebaseapp.com'
