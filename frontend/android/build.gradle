// Live camera text reading: only the Japanese ML Kit model (also reads Latin).
ext["react-native-vision-camera-mlkit"] = [
    mlkit: [
        textRecognition: false,
        textRecognitionChinese: false,
        textRecognitionDevanagari: false,
        textRecognitionJapanese: true,
        textRecognitionKorean: false,
        barcodeScanning: false,
    ]
]

buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
